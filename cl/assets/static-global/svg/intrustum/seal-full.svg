<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Intrustum seal — Texas, MMXXIII">
  <circle cx="100" cy="100" r="96" fill="none" stroke="#1A1C20" stroke-width="3"/>
  <circle cx="100" cy="100" r="64" fill="none" stroke="#1A1C20" stroke-width="1.25"/>
  <defs>
    <path id="arcTop" d="M 20,100 A 80,80 0 0 1 180,100"/>
    <path id="arcBot" d="M 20,100 A 80,80 0 0 0 180,100"/>
  </defs>
  <text font-family="interface, sans-serif" font-size="14.5" letter-spacing="6" fill="#1A1C20" font-weight="600">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">INTRUSTUM</textPath>
  </text>
  <text font-family="interface, sans-serif" font-size="10.5" letter-spacing="3" fill="#1A1C20" font-weight="500">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">TEXAS &#183; MMXXIII</textPath>
  </text>
  <path d="M 72,76 H 128 L 116,122 H 84 Z" fill="#8C6A3F"/>
</svg>
